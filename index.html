<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Defended Presentation</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    overflow: hidden;
    background: linear-gradient(135deg, #020617, #06111f, #082f49);
}

.slides {
    width: 100%;
    height: 100vh;
    position: relative;
}

.slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s ease;
}

.slide.active {
    opacity: 1;
    visibility: visible;
}

.card {
    width: 85vw;
    height: 85vh;
    border-radius: 35px;
    padding: 50px;
    background: rgba(7, 20, 38, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

h1 {
    color: #e0f7ff;
    font-size: clamp(2.4rem, 5vw, 4.5rem);
    font-weight: 900;
    line-height: 1.2;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.55);
}

h2 {
    color: #38bdf8;
    font-size: clamp(2rem, 4vw, 3.5rem);
    margin-bottom: 25px;
}

img {
    max-width: 100%;
    max-height: 62vh;
    border-radius: 22px;
    border: 1px solid rgba(56, 189, 248, 0.45);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    cursor: pointer;
}

.defended {
    color: #22c55e;
    margin-top: 35px;
    font-size: clamp(2.2rem, 5vw, 4rem);
}

.dots {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
}

.dot {
    width: 11px;
    height: 11px;
    background: rgba(125, 211, 252, 0.45);
    border-radius: 50%;
    cursor: pointer;
}

.dot.active-dot {
    width: 30px;
    border-radius: 20px;
    background: #38bdf8;
}

.fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.fullscreen img {
    max-width: 95%;
    max-height: 95%;
}
</style>
</head>

<body>

<div class="slides">

    <div class="slide active">
        <div class="card">
            <h1>A BARCODE-DRIVEN SALES AND CONTAINER INVENTORY MANAGEMENT SYSTEM FOR WATER REFILING STATIONS</h1>
        </div>
    </div>

    <div class="slide">
        <div class="card">
            <div>
                <h2>ERD DIAGRAM</h2>
                <img class="zoomable" src="img1.png" alt="ERD Diagram">
            </div>
        </div>
    </div>

    <div class="slide">
        <div class="card">
            <h1>THANK YOU!!!</h1>
        </div>
    </div>

    <div class="slide">
        <div class="card">
            <div>
                <h1>A BARCODE-DRIVEN SALES AND CONTAINER INVENTORY MANAGEMENT SYSTEM FOR WATER REFILING STATIONS</h1>
                <h1 class="defended">DATABASE DEFENDED!!!</h1>
            </div>
        </div>
    </div>

</div>

<div class="fullscreen" id="fullscreen">
    <img id="fullImg" alt="Fullscreen Image">
</div>

<div class="dots" id="dots"></div>

<script>
let currentSlide = 0;
const slides = document.querySelectorAll(".slide");
const dotsContainer = document.getElementById("dots");
let zoomActive = false;

function createDots() {
    dotsContainer.innerHTML = "";
    slides.forEach((_, index) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (index === currentSlide) dot.classList.add("active-dot");
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
    });
}

function updateDots() {
    document.querySelectorAll(".dot").forEach((dot, index) => {
        dot.classList.toggle("active-dot", index === currentSlide);
    });
}

function goToSlide(index) {
    if (zoomActive || index < 0 || index >= slides.length) return;
    slides[currentSlide].classList.remove("active");
    currentSlide = index;
    slides[currentSlide].classList.add("active");
    updateDots();
}

function nextSlide() {
    if (currentSlide < slides.length - 1) goToSlide(currentSlide + 1);
}

function prevSlide() {
    if (currentSlide > 0) goToSlide(currentSlide - 1);
}

document.addEventListener("keydown", e => {
    if (zoomActive && e.key === "Escape") closeFullscreen();
    else if (e.key === "ArrowRight" || e.key === " ") nextSlide();
    else if (e.key === "ArrowLeft") prevSlide();
});

let wheelLock = false;
window.addEventListener("wheel", e => {
    if (zoomActive || wheelLock) return;
    e.deltaY > 0 ? nextSlide() : prevSlide();
    wheelLock = true;
    setTimeout(() => wheelLock = false, 220);
});

function openFullscreen(img) {
    document.getElementById("fullImg").src = img.src;
    document.getElementById("fullscreen").style.display = "flex";
    zoomActive = true;
}

function closeFullscreen() {
    document.getElementById("fullscreen").style.display = "none";
    zoomActive = false;
}

document.querySelectorAll(".zoomable").forEach(img => {
    img.onclick = e => {
        e.stopPropagation();
        openFullscreen(img);
    };
});

document.getElementById("fullscreen").onclick = closeFullscreen;

createDots();
</script>

</body>
</html>
